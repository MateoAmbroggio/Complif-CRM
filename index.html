<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM · BDR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #EEF0F3; --surface: #FFFFFF; --border: #DDE1E7; --border-soft:#E7EAEF;
  --ink: #16202E; --muted: #5B6675; --muted-2:#8A94A6;
  --accent: #0E7C86; --warm: #D98A2B; --cold: #B0563E; --good: #2E9E6B;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
.mono, .stat-value, .funnel-count, .eyebrow, .quota-achieved, .quota-pct, .country-metrics b, .cool-days { font-family: 'IBM Plex Mono', monospace; font-feature-settings: 'tnum'; }
.ic { display: inline-block; vertical-align: -0.15em; }

#app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 232px; flex-shrink: 0; background: #101823; color: #C7CFDA; display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 11px; align-items: center; padding: 4px 8px 20px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: 'IBM Plex Mono'; font-weight: 600; font-size: 18px; }
.brand-name { font-weight: 600; font-size: 14px; color: #fff; letter-spacing: .02em; }
.brand-sub { font-size: 11px; color: #6E7A8A; font-family: 'IBM Plex Mono'; margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 8px; border: none; background: none; color: #AEB8C6; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left; transition: .12s; }
.nav-item:hover { background: #1A2530; color: #E4EAF1; }
.nav-item.active { background: #1E2A38; color: #fff; }
.nav-item.active .ic { color: var(--accent); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid #1E2732; }
.sidebar-foot .ghost-btn { justify-content: flex-start; color: #8A94A6; border-color: transparent; background: none; }
.sidebar-foot .ghost-btn:hover { color: #fff; background: #1A2530; }

/* Content */
.content { flex: 1; min-width: 0; padding: 34px 40px 60px; }
.view { max-width: 940px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 5px; }
.view-head h1 { font-size: 25px; font-weight: 600; letter-spacing: -.01em; margin: 0; }

/* Buttons */
.primary-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: #fff; border: none; padding: 9px 15px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: .12s; white-space: nowrap; }
.primary-btn:hover { background: #24303f; }
.primary-btn:disabled { opacity: .4; cursor: not-allowed; }
.ghost-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 13px; border-radius: 8px; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: .12s; }
.ghost-btn:hover { border-color: var(--muted-2); color: var(--ink); }
.link-btn { display: inline-flex; align-items: center; gap: 3px; background: none; border: none; color: var(--accent); font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.icon-btn { background: none; border: none; color: var(--muted-2); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--bg); color: var(--ink); }

/* Quota hero */
.quota-card { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; background: linear-gradient(120deg, #12202B, #16303A); color: #fff; border-radius: 14px; padding: 22px 26px; margin-bottom: 18px; }
.quota-top { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: #9DB4BC; }
.quota-top .ic { color: var(--accent); }
.quota-edit { margin-left: auto; background: rgba(255,255,255,.1); border: none; color: #C7D6DB; font-family: inherit; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.quota-edit:hover { background: rgba(255,255,255,.18); color: #fff; }
.quota-figures { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
.quota-achieved { font-size: 42px; font-weight: 600; line-height: 1; }
.quota-of { font-size: 19px; color: #7E97A0; font-family: 'IBM Plex Mono'; }
.quota-caption { font-size: 12px; color: #8DA4AC; margin-top: 6px; }
.quota-right { display: flex; flex-direction: column; justify-content: center; }
.quota-pct { font-size: 30px; font-weight: 600; text-align: right; margin-bottom: 8px; }
.quota-bar { height: 10px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; }
.quota-fill { height: 100%; border-radius: 6px; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.quota-remain { font-size: 12px; color: #8DA4AC; margin-top: 8px; text-align: right; }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 17px; }
.stat-value { font-size: 27px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.stat-label { font-size: 12.5px; font-weight: 600; margin-top: 9px; }
.stat-hint { font-size: 11px; color: var(--muted-2); margin-top: 2px; }
.stat-accent { border-color: #B6DDE0; } .stat-accent .stat-value { color: var(--accent); }
.stat-warm { border-color: #EBD0A6; } .stat-warm .stat-value { color: var(--warm); }

/* Cards */
.two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
.two-col .card { margin-bottom: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.card-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
.muted-sm { font-size: 12px; color: var(--muted); }
.mini-empty { font-size: 12.5px; color: var(--muted-2); padding: 16px 0; line-height: 1.5; }

/* Enfriándose */
.legend { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.legend b { font-family: 'IBM Plex Mono'; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cool-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cool-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border-soft); }
.cool-row:first-child { border-top: none; }
.cool-badge { font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; min-width: 104px; text-align: center; display: inline-flex; align-items: center; gap: 5px; justify-content: center; }
.cool-name { flex: 1; display: flex; align-items: center; gap: 8px; background: none; border: none; font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; min-width: 0; }
.cool-name:hover { color: var(--accent); }
.cool-sub { font-size: 11px; color: var(--muted-2); }
.cool-actions { display: flex; gap: 6px; flex-shrink: 0; }
.cool-actions button { background: none; border: 1px solid var(--border); color: var(--muted); font-family: inherit; font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.cool-actions button:hover { border-color: var(--accent); color: var(--accent); }

/* Funnel */
.funnel { display: flex; gap: 6px; align-items: stretch; height: 168px; }
.funnel-seg { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; padding: 0; }
.funnel-bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; background: linear-gradient(180deg, transparent, #F4F6F8); border-radius: 7px; overflow: hidden; min-height: 0; }
.funnel-bar { width: 100%; border-radius: 7px 7px 0 0; min-height: 4px; transition: height .4s cubic-bezier(.2,.7,.3,1); opacity: .9; }
.funnel-seg:hover .funnel-bar { opacity: 1; }
.funnel-count { font-size: 18px; font-weight: 600; }
.funnel-label { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.25; font-weight: 500; }

/* Por país */
.country-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.country-row { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; }
.country-name { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.country-track { height: 8px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.country-fill { height: 100%; background: var(--accent); border-radius: 5px; opacity: .85; transition: width .4s; }
.country-metrics { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.country-metrics b { font-size: 13px; }
.country-arr { font-size: 10.5px; color: var(--muted-2); }

/* Feed / timeline */
.feed, .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed-row, .tl-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--border-soft); }
.feed-row:first-child, .tl-row:first-child { border-top: none; }
.feed-icon, .tl-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
.feed-body, .tl-body { flex: 1; min-width: 0; }
.feed-top, .tl-top { font-size: 13px; }
.feed-note, .tl-note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.feed-date, .tl-date { font-family: 'IBM Plex Mono'; font-size: 11.5px; color: var(--muted-2); }
.tl-date { margin-left: 6px; }
.timeline .tl-row { align-items: center; }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--muted-2); flex: 1; min-width: 200px; max-width: 300px; }
.search input { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; color: var(--ink); width: 100%; }
.country-select { font-family: inherit; font-size: 12.5px; color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; background: var(--surface); cursor: pointer; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; transition: .12s; }
.chip:hover { border-color: var(--muted-2); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Account grid */
.acc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.acc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 17px; display: flex; flex-direction: column; gap: 10px; }
.acc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.acc-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.acc-actions { display: flex; gap: 2px; flex-shrink: 0; }
.acc-actions button, .td-actions button { background: none; border: none; color: var(--muted-2); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.acc-actions button:hover, .td-actions button:hover { background: var(--bg); color: var(--ink); }
.acc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: #EAF4F5; color: #0B6169; }
.tag.ghost { background: var(--bg); color: var(--muted); }
.tag.arr { background: #FBF0DD; color: #A96A16; font-family: 'IBM Plex Mono'; font-weight: 600; }
.tag.cool { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono'; font-weight: 600; }
.acc-notes { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.acc-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
.stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stage-select { border: none; background: none; font-family: 'IBM Plex Mono'; font-size: 12px; font-weight: 600; cursor: pointer; outline: none; padding: 2px 0; }
.touch-btn { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.touch-btn:hover { border-color: var(--good); color: var(--good); }

/* Table */
.table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.tr { display: grid; grid-template-columns: 1.4fr 1.2fr 1.4fr .8fr auto; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border-soft); }
.tr.th { border-top: none; background: #F7F8FA; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-2); font-weight: 600; }
.td-name { font-weight: 600; font-size: 13.5px; }
.td-links { display: flex; gap: 8px; }
.td-links a { color: var(--muted-2); display: grid; place-items: center; }
.td-links a:hover { color: var(--accent); }
.td-actions { display: flex; gap: 2px; justify-content: flex-end; }

/* Empty */
.empty { text-align: center; padding: 44px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
.empty p { font-size: 13.5px; margin: 0 0 16px; max-width: 400px; margin-inline: auto; line-height: 1.5; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(16,24,35,.42); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; box-shadow: 0 24px 60px rgba(16,24,35,.28); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--surface); }
.modal-head h3 { font-size: 15px; font-weight: 600; margin: 0; }
.modal-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { font-family: inherit; font-size: 13.5px; color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; outline: none; background: var(--surface); transition: .12s; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,124,134,.12); }
.field textarea { resize: vertical; line-height: 1.5; }
.form-note { font-size: 11.5px; color: var(--muted-2); margin: -4px 0 0; line-height: 1.4; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.type-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.type-opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 11px; font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.type-opt.on { font-weight: 600; }

/* Settings */
.settings-section { border: 1px solid var(--border-soft); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.settings-head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
.settings-head .ic { color: var(--accent); }
.settings-note { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.45; }
.country-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.country-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 7px; padding: 5px 6px 5px 10px; font-size: 12.5px; font-weight: 500; }
.country-chip button { background: none; border: none; color: var(--muted-2); cursor: pointer; display: grid; place-items: center; padding: 2px; border-radius: 4px; }
.country-chip button:hover { background: #DDE1E7; color: var(--ink); }
.add-country { display: flex; gap: 8px; }
.add-country input { flex: 1; font-family: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; outline: none; }
.add-country input:focus { border-color: var(--accent); }

@media (max-width: 820px) {
  .quota-card { grid-template-columns: 1fr; gap: 18px; }
  .quota-pct, .quota-remain { text-align: left; }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .sidebar { width: 64px; padding: 18px 10px; }
  .brand > div, .nav-item span, .sidebar-foot .ghost-btn span { display: none; }
  .brand { justify-content: center; }
  .nav-item { justify-content: center; }
  .content { padding: 24px 18px 50px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .acc-grid { grid-template-columns: 1fr; }
  .row-2 { grid-template-columns: 1fr; }
  .tr { grid-template-columns: 1.4fr .8fr auto; }
  .tr span:nth-child(3) { display: none; }
}
</style>
</head>

/* ============================ Constantes ============================ */
const STAGES = [

];
const stageOf = (id) => STAGES.find(s => s.id === id) || STAGES[0];
const ACCOUNT_TYPES = ["Banco","Cooperativa","Casa de cambio","Aseguradora","APNFD","Procesadora","Otro"];
const ACTIVITY_TYPES = [
  { id:"llamada", label:"Llamada", icon:"phone", color:"#5B7CB0" },

];

const DEFAULTS = {
  accounts: [], contacts: [], activities: [],
  countries: ["Rep. Dominicana","Panamá","Honduras","Otro"],
  quota: { target: 50000 },
  config: { warmDays: 3, coldDays: 7 }
};

/* ============================ Utilidades ============================ */
const LS_KEY = "complif-crm-v1";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2));
const today = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d) => d ? new Date(d+"T00:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short"}) : "—";
function fmtUSD(n){ const v=Number(n)||0; if(v===0) return "$0"; if(Math.abs(v)>=1000) return "$"+new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:1}).format(v); return "$"+v.toLocaleString("en-US"); }
const cap = (s) => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
function daysSince(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+"T00:00:00"); const n=new Date(); const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.round((t-d)/86400000); }
function monthStartStr(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10); }
const inThisMonth = (d) => d && d >= monthStartStr();

function coolStatus(acc){
  if(["descartado","pasado"].includes(acc.stage)) return null;
  const ref = acc.lastContact || acc.createdAt;
  const ds = daysSince(ref);
  if(ds==null) return null;
  const verb = acc.lastContact ? "sin tocar" : "sin contactar";
  const { warmDays, coldDays } = db.config;
  if(ds >= coldDays) return { key:"cold", color:"var(--cold)", label:ds+"d "+verb, ds };
  if(ds >= warmDays) return { key:"warm", color:"var(--warm)", label:ds+"d "+verb, ds };
  return { key:"fresh", color:"var(--good)", label: (ds<=0?"hoy":"hace "+ds+"d"), ds };
}

/* ============================ Estado ============================ */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return clone(DEFAULTS);
    const d = JSON.parse(raw);
    return {
      accounts: Array.isArray(d.accounts)?d.accounts:[],
      contacts: Array.isArray(d.contacts)?d.contacts:[],
      activities: Array.isArray(d.activities)?d.activities:[],
      countries: (Array.isArray(d.countries)&&d.countries.length)?d.countries:clone(DEFAULTS.countries),
      quota: Object.assign(clone(DEFAULTS.quota), d.quota||{}),
      config: Object.assign(clone(DEFAULTS.config), d.config||{})
    };
  } catch(e){ return clone(DEFAULTS); }
}
let db = load();
let ui = { view:"panel", modal:null, filters:{ accQ:"", conQ:"", stage:"todas", country:"todos", opps:false, cold:false, act:"todas" }, _focus:null, _caret:null };
let storageOK = true;
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ storageOK = false; }
}

/* Actualiza último contacto de una cuenta hacia adelante */
function bumpLastContact(accountId, date){
  if(!accountId) return;
  const a = db.accounts.find(x => x.id === accountId);
  if(!a) return;
  if(!a.lastContact || date > a.lastContact) a.lastContact = date;
}

/* ============================ Cálculos ============================ */
function quotaCalc(){
  const opps = db.accounts.filter(a => (Number(a.arr)||0) > 0 && inThisMonth(a.oppDate));
  const achieved = opps.reduce((s,a) => s+(Number(a.arr)||0), 0);
  const target = Math.max(0, Number(db.quota.target)||0);
  const pct = target ? Math.round((achieved/target)*100) : 0;
  return { achieved, target, pct, count: opps.length, avg: opps.length ? achieved/opps.length : 0 };
}

  '</div></section>';

  '<div class="stat-grid">'+

    stat(touches,"Toques (7 días)","tu ritmo","accent")+

    .filter(c => (c.name+" "+(c.role||"")).toLowerCase().includes(f.conQ.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));

  let html = '<div class="view"><header class="view-head"><div><div class="eyebrow">Contactos</div><h1>Personas</h1></div><button class="primary-btn" data-act="new-contact">'+icon("plus",16)+' Nuevo contacto</button></header>';
  html += '<div class="toolbar"><div class="search">'+icon("search",15)+'<input id="conQ" data-input="conQ" placeholder="Buscar persona…" value="'+esc(f.conQ)+'" /></div></div>';

  if(list.length===0){
    html += emptyBlock(db.contacts.length===0?"Sin contactos todavía. Cargá a las personas con las que hablás.":"Nadie coincide con la búsqueda.", db.contacts.length===0?"Cargar el primero":"", "new-contact");
  } else {
    html += '<div class="table"><div class="tr th"><span>Nombre</span><span>Cargo</span><span>Institución</span><span>Contacto</span><span></span></div>'+
      list.map(c => '<div class="tr"><span class="td-name">'+esc(c.name)+'</span><span class="muted-sm">'+esc(c.role||"—")+'</span><span class="muted-sm">'+esc(accName(c.accountId)||"—")+'</span><span class="td-links">'+
        (c.email?'<a href="mailto:'+esc(c.email)+'" title="'+esc(c.email)+'">'+icon("mail",15)+'</a>':"")+
        (c.phone?'<a href="tel:'+esc(c.phone)+'" title="'+esc(c.phone)+'">'+icon("phone",15)+'</a>':"")+
        (c.linkedin?'<a href="'+esc(c.linkedin)+'" target="_blank" rel="noreferrer" title="LinkedIn">'+icon("linkedin",15)+'</a>':"")+
      '</span><span class="td-actions"><button data-act="edit-contact" data-id="'+c.id+'">'+icon("pencil",14)+'</button><button data-act="del-contact" data-id="'+c.id+'">'+icon("trash",14)+'</button></span></div>').join("") +
    '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================ Vista: Actividad ============================ */
function viewActivity(){
  const f = ui.filters;
  const nameFor = (a) => {
    const con = db.contacts.find(x=>x.id===a.contactId);
    const acc = db.accounts.find(x=>x.id===a.accountId);
    return [con&&con.name, acc&&acc.name].filter(Boolean).join(" · ") || "Sin vincular";
  };
  let list = db.activities.slice().filter(a => f.act==="todas" || a.type===f.act).sort((a,b)=> a.date<b.date?1:-1);

  let html = '<div class="view"><header class="view-head"><div><div class="eyebrow">Actividad</div><h1>Registro de toques</h1></div><button class="primary-btn" data-act="new-activity">'+icon("plus",16)+' Registrar</button></header>';
  html += '<div class="chips"><button class="chip'+(f.act==="todas"?" on":"")+'" data-act="act-filter" data-t="todas">Todas</button>'+
    ACTIVITY_TYPES.map(t=>'<button class="chip'+(f.act===t.id?" on":"")+'" data-act="act-filter" data-t="'+t.id+'" style="'+(f.act===t.id?"border-color:"+t.color+";color:"+t.color:"")+'">'+t.label+'</button>').join("") +'</div>';

  if(list.length===0){
    html += emptyBlock("Sin actividad registrada. Anotá cada llamada, mail, reunión o nota para medir tu ritmo.","Registrar la primera","new-activity");
  } else {
    html += '<ul class="timeline">'+ list.map(a=>{
      const t = actType(a.type);
      return '<li class="tl-row"><span class="tl-icon" style="background:color-mix(in srgb,'+t.color+' 12%, transparent);color:'+t.color+'">'+icon(t.icon,16)+'</span><div class="tl-body"><div class="tl-top"><strong>'+t.label+'</strong> · '+esc(nameFor(a))+' <span class="tl-date">'+fmtDate(a.date)+'</span></div>'+(a.notes?'<div class="tl-note">'+esc(a.notes)+'</div>':"")+'</div><span class="td-actions"><button data-act="edit-activity" data-id="'+a.id+'">'+icon("pencil",14)+'</button><button data-act="del-activity" data-id="'+a.id+'">'+icon("trash",14)+'</button></span></li>';
    }).join("") +'</ul>';
  }
  html += '</div>';
  return html;
}

/* ============================ Modales ============================ */
function modalShell(title, body){
  return '<div class="modal-overlay" data-act="overlay"><div class="modal" data-stop="1"><div class="modal-head"><h3>'+title+'</h3><button class="icon-btn" data-act="close-modal">'+icon("x",18)+'</button></div><div class="modal-body">'+body+'</div></div></div>';
}
function field(label, inner){ return '<label class="field"><span class="field-label">'+label+'</span>'+inner+'</label>'; }

function renderModal(){
  const m = ui.modal;
  if(m.type==="account") return modalAccount(m.id);
  if(m.type==="contact") return modalContact(m.id);
  if(m.type==="activity") return modalActivity(m.id);
  if(m.type==="settings") return modalSettings();
  return "";
}

function modalAccount(id){
  const a = id ? db.accounts.find(x=>x.id===id) : null;
  const g = (k,d)=> a && a[k]!=null ? a[k] : d;
  const opt = (arr,sel,valFn,labFn)=> arr.map(o=>{ const v=valFn?valFn(o):o; const l=labFn?labFn(o):o; return '<option value="'+esc(v)+'"'+(String(sel)===String(v)?" selected":"")+'>'+esc(l)+'</option>'; }).join("");
  const body =
    field("Nombre de la institución",'<input id="f-name" value="'+esc(g("name",""))+'" placeholder="Banco Popular Dominicano" />')+
    '<div class="row-2">'+
      field("Tipo",'<select id="f-type">'+opt(ACCOUNT_TYPES,g("type","Banco"))+'</select>')+
      field("País",'<select id="f-country">'+opt(db.countries,g("country",db.countries[0]||""))+'</select>')+
    '</div>'+
    field("Etapa",'<select id="f-stage">'+opt(STAGES,g("stage","nuevo"),s=>s.id,s=>s.label)+'</select>')+
    '<div class="row-2">'+
      field("ARR estimado (USD)",'<input id="f-arr" type="number" min="0" step="1000" value="'+esc(g("arr",""))+'" placeholder="0" />')+
      field("Fecha de la oportunidad",'<input id="f-oppDate" type="date" value="'+esc(g("oppDate",today()))+'" />')+
    '</div>'+
    '<p class="form-note">El ARR suma a tu cuota del mes de la fecha de oportunidad. Dejalo en 0 hasta que la oportunidad exista.</p>'+
    field("Notas",'<textarea id="f-notes" rows="3" placeholder="Contexto, dolor detectado, trigger de compra…">'+esc(g("notes",""))+'</textarea>')+
    '<div class="modal-actions"><button class="ghost-btn" data-act="close-modal">Cancelar</button><button class="primary-btn" data-act="save-account">Guardar cuenta</button></div>';
  return modalShell(id?"Editar cuenta":"Nueva cuenta", body);
}

function modalContact(id){
  const c = id ? db.contacts.find(x=>x.id===id) : null;
  const g = (k,d)=> c && c[k]!=null ? c[k] : d;
  const accOpts = '<option value="">— Sin vincular —</option>'+ db.accounts.map(a=>'<option value="'+a.id+'"'+(g("accountId","")===a.id?" selected":"")+'>'+esc(a.name)+'</option>').join("");
  const body =
    field("Nombre",'<input id="f-name" value="'+esc(g("name",""))+'" placeholder="María Fernández" />')+
    '<div class="row-2">'+
      field("Cargo",'<input id="f-role" value="'+esc(g("role",""))+'" placeholder="Oficial de Cumplimiento" />')+
      field("Institución",'<select id="f-accountId">'+accOpts+'</select>')+
    '</div>'+
    '<div class="row-2">'+
      field("Email",'<input id="f-email" value="'+esc(g("email",""))+'" placeholder="maria@banco.com" />')+
      field("Teléfono",'<input id="f-phone" value="'+esc(g("phone",""))+'" placeholder="+1 809…" />')+
    '</div>'+
    field("LinkedIn (URL)",'<input id="f-linkedin" value="'+esc(g("linkedin",""))+'" placeholder="https://linkedin.com/in/…" />')+
    '<div class="modal-actions"><button class="ghost-btn" data-act="close-modal">Cancelar</button><button class="primary-btn" data-act="save-contact">Guardar contacto</button></div>';
  return modalShell(id?"Editar contacto":"Nuevo contacto", body);
}

function modalActivity(id){
  const a = id ? db.activities.find(x=>x.id===id) : null;
  const g = (k,d)=> a && a[k]!=null ? a[k] : d;
  const curType = g("type","llamada");
  const typePicker = '<div class="type-picker">'+ ACTIVITY_TYPES.map(t=>'<button type="button" class="type-opt'+(curType===t.id?" on":"")+'" data-act="pick-type" data-t="'+t.id+'" style="'+(curType===t.id?"border-color:"+t.color+";color:"+t.color+";background:color-mix(in srgb,"+t.color+" 8%, transparent)":"")+'">'+icon(t.icon,16)+' '+t.label+'</button>').join("") +'</div><input type="hidden" id="f-type" value="'+esc(curType)+'" />';
  const accOpts = '<option value="">— Ninguna —</option>'+ db.accounts.map(x=>'<option value="'+x.id+'"'+(g("accountId","")===x.id?" selected":"")+'>'+esc(x.name)+'</option>').join("");
  const conOpts = '<option value="">— Ninguno —</option>'+ db.contacts.map(x=>'<option value="'+x.id+'"'+(g("contactId","")===x.id?" selected":"")+'>'+esc(x.name)+'</option>').join("");
  const body =
    field("Tipo", typePicker)+
    '<div class="row-2">'+
      field("Fecha",'<input id="f-date" type="date" value="'+esc(g("date",today()))+'" />')+
      field("Institución",'<select id="f-accountId">'+accOpts+'</select>')+
    '</div>'+
    field("Contacto",'<select id="f-contactId">'+conOpts+'</select>')+
    field("Notas",'<textarea id="f-notes" rows="3" placeholder="Qué pasó, próximos pasos, respuesta…">'+esc(g("notes",""))+'</textarea>')+
    '<p class="form-note">Registrar una actividad para una cuenta actualiza solo su “último contacto”, así las alertas de enfriamiento se recalculan.</p>'+
    '<div class="modal-actions"><button class="ghost-btn" data-act="close-modal">Cancelar</button><button class="primary-btn" data-act="save-activity">Guardar</button></div>';
  return modalShell(id?"Editar actividad":"Registrar actividad", body);
}

function modalSettings(){
  const body =
    '<div class="settings-section"><div class="settings-head">'+icon("target",15)+' Cuota mensual</div>'+
      field("Objetivo de ARR por mes (USD)",'<input id="s-target" type="number" min="0" step="1000" value="'+esc(db.quota.target)+'" />')+
      '<p class="settings-note">Tu cuota se cumple sumando el ARR estimado de las oportunidades que generás cada mes (según la fecha de oportunidad de cada cuenta).</p>'+
    '</div>'+
    '<div class="settings-section"><div class="settings-head">'+icon("bell",15)+' Alertas de enfriamiento</div>'+
      '<div class="row-2">'+
        field("Días para “tibio” 🟡",'<input id="s-warm" type="number" min="1" value="'+esc(db.config.warmDays)+'" />')+
        field("Días para “frío” 🔴",'<input id="s-cold" type="number" min="1" value="'+esc(db.config.coldDays)+'" />')+
      '</div>'+
      '<p class="settings-note">Una cuenta activa se pone amarilla al pasar los días de “tibio” sin contacto, y roja al pasar los de “frío”. El contador se reinicia cada vez que registrás una actividad o tocás “Tocada hoy”.</p>'+
    '</div>'+
    '<div class="settings-section"><div class="settings-head">'+icon("globe",15)+' Países</div>'+
      '<div class="country-chips">'+ db.countries.map(c=>'<span class="country-chip">'+esc(c)+'<button data-act="del-country" data-c="'+esc(c)+'">'+icon("x",12)+'</button></span>').join("") +'</div>'+
      '<div class="add-country"><input id="s-newcountry" placeholder="Agregar país…" /><button class="ghost-btn" data-act="add-country">'+icon("plus",14)+' Agregar</button></div>'+
    '</div>'+
    '<div class="modal-actions"><button class="primary-btn" data-act="save-settings">Listo</button></div>';
  return modalShell("Ajustes", body);
}

/* ============================ Acciones ============================ */
const val = (id) => { const e=document.getElementById(id); return e?e.value:""; };

function openModal(type,id){ ui.modal={type,id:id||null}; render(); }
function closeModal(){ ui.modal=null; render(); }

function saveAccount(){
  const name = val("f-name").trim(); if(!name){ alert("La cuenta necesita un nombre."); return; }
  const data = {
    name, type: val("f-type"), country: val("f-country"), stage: val("f-stage"),
    arr: val("f-arr") ? Number(val("f-arr")) : "", oppDate: val("f-oppDate"), notes: val("f-notes")
  };
  const id = ui.modal.id;
  if(id){ const a=db.accounts.find(x=>x.id===id); Object.assign(a,data); }
  else db.accounts.push(Object.assign({ id:uid(), createdAt:today(), lastContact:"" }, data));
  save(); closeModal();
}
function saveContact(){
  const name = val("f-name").trim(); if(!name){ alert("El contacto necesita un nombre."); return; }
  const data = { name, role:val("f-role"), accountId:val("f-accountId"), email:val("f-email"), phone:val("f-phone"), linkedin:val("f-linkedin") };
  const id = ui.modal.id;
  if(id){ const c=db.contacts.find(x=>x.id===id); Object.assign(c,data); }
  else db.contacts.push(Object.assign({ id:uid(), createdAt:today() }, data));
  save(); closeModal();
}
function saveActivity(){
  const data = { type:val("f-type"), date:val("f-date")||today(), accountId:val("f-accountId"), contactId:val("f-contactId"), notes:val("f-notes") };
  const id = ui.modal.id;
  if(id){ const a=db.activities.find(x=>x.id===id); Object.assign(a,data); }
  else db.activities.push(Object.assign({ id:uid(), createdAt:today() }, data));
  bumpLastContact(data.accountId, data.date);
  save(); closeModal();
}
function saveSettings(){
  db.quota.target = Number(val("s-target"))||0;
  db.config.warmDays = Math.max(1, Number(val("s-warm"))||3);
  db.config.coldDays = Math.max(db.config.warmDays, Number(val("s-cold"))||7);
  save(); closeModal();
}
function addCountry(){
  const v = val("s-newcountry").trim();
  if(v && !db.countries.includes(v)){ db.countries.push(v); save(); render(); setTimeout(()=>{ const e=document.getElementById("s-newcountry"); if(e) e.focus(); },0); }
}
function delCountry(c){
  const used = db.accounts.filter(a=>a.country===c).length;
  if(used && !confirm(used+' cuenta(s) usan "'+c+'". Se borra el país igual (las cuentas conservan el texto). ¿Seguir?')) return;
  db.countries = db.countries.filter(x=>x!==c); save(); render();
}
function touchToday(id){ const a=db.accounts.find(x=>x.id===id); if(a){ a.lastContact=today(); save(); render(); } }

function exportData(){
  const blob = new Blob([JSON.stringify(Object.assign({}, db, { exportedAt:new Date().toISOString() }), null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="crm-bdr-"+today()+".json"; a.click();
  URL.revokeObjectURL(url);
}
function importData(){
  const input = document.createElement("input"); input.type="file"; input.accept="application/json";
  input.onchange = () => {
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if(Array.isArray(d.accounts)) db.accounts = d.accounts;
        if(Array.isArray(d.contacts)) db.contacts = d.contacts;
        if(Array.isArray(d.activities)) db.activities = d.activities;
        if(Array.isArray(d.countries)&&d.countries.length) db.countries = d.countries;
        if(d.quota) db.quota = Object.assign(clone(DEFAULTS.quota), d.quota);
        if(d.config) db.config = Object.assign(clone(DEFAULTS.config), d.config);
        save(); render();
      } catch(e){ alert("No pude leer ese archivo. ¿Es un export válido?"); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ============================ Delegación de eventos ============================ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  switch(act){
    case "nav": ui.view = t.dataset.view; ui.modal=null; render(); break;
    case "settings": openModal("settings"); break;
    case "export": exportData(); break;
    case "import": importData(); break;
    case "new-account": openModal("account"); break;
    case "edit-account": openModal("account", id); break;
    case "del-account": if(confirm("¿Borrar esta cuenta?")){ db.accounts=db.accounts.filter(a=>a.id!==id); save(); render(); } break;
    case "new-contact": openModal("contact"); break;
    case "edit-contact": openModal("contact", id); break;
    case "del-contact": if(confirm("¿Borrar este contacto?")){ db.contacts=db.contacts.filter(c=>c.id!==id); save(); render(); } break;
    case "new-activity": openModal("activity"); break;
    case "edit-activity": openModal("activity", id); break;
    case "del-activity": if(confirm("¿Borrar esta actividad?")){ db.activities=db.activities.filter(a=>a.id!==id); save(); render(); } break;
    case "touch": touchToday(id); break;
    case "stage-filter": ui.filters.stage=t.dataset.stage; render(); break;
    case "act-filter": ui.filters.act=t.dataset.t; render(); break;
    case "toggle-opps": ui.filters.opps=!ui.filters.opps; render(); break;
    case "toggle-cold": ui.filters.cold=!ui.filters.cold; render(); break;
    case "pick-type": { const h=document.getElementById("f-type"); if(h) h.value=t.dataset.t; document.querySelectorAll(".type-opt").forEach(o=>o.classList.remove("on")); t.classList.add("on"); break; }
    case "save-account": saveAccount(); break;
    case "save-contact": saveContact(); break;
    case "save-activity": saveActivity(); break;
    case "save-settings": saveSettings(); break;
    case "add-country": addCountry(); break;
    case "del-country": delCountry(t.dataset.c); break;
    case "close-modal": closeModal(); break;
    case "overlay": if(e.target.classList.contains("modal-overlay")) closeModal(); break;
  }
});

document.addEventListener("input", (e) => {
  const t = e.target.closest("[data-input]");
  if(!t) return;
  const key = t.dataset.input;
  if(key==="accQ"){ ui.filters.accQ=t.value; ui._focus="accQ"; ui._caret=t.selectionStart; render(); }
  else if(key==="conQ"){ ui.filters.conQ=t.value; ui._focus="conQ"; ui._caret=t.selectionStart; render(); }
});
document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-change],[data-input]");
  if(!t) return;
  if(t.dataset.change==="stage"){ const a=db.accounts.find(x=>x.id===t.dataset.id); if(a){ a.stage=t.value; save(); render(); } }
  else if(t.dataset.input==="country"){ ui.filters.country=t.value; render(); }
});
document.addEventListener("keydown", (e) => { if(e.key==="Escape" && ui.modal){ closeModal(); } });

/* ============================ Init ============================ */
render();
if(!storageOK){
  setTimeout(()=>alert("Aviso: este navegador no está guardando datos localmente (puede pasar en modo incógnito o con archivos file://). Usá Exportar seguido para no perder info."), 300);
}
</script>
